<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f4f7fb;
}

.container{
    background:#fff;
    padding:40px;
    width:420px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.tick{
    font-size:70px;
    color:#28a745;
}

h1{
    margin:15px 0;
    color:#333;
}

p{
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

button{
    background:#007bff;
    color:#fff;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="container">

<div class="tick">✅</div>

<h1>Thank You!</h1>

<p>
Your booking has been submitted successfully.
<br><br>
The <b>ODRS Team</b> will contact you shortly.
</p>

<button onclick="window.location.href='index.html'">
Back to Home
</button>

</div>

</body>
</html>
